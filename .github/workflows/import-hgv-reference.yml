name: Import HGV Reference Site

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/import-hgv-reference.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-site:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build exact manifest
        shell: bash
        run: cat .github/hgv-zip-manifest.part*.txt > /tmp/hgv-manifest.txt

      - name: Import sanitized HGV website
        shell: bash
        run: python3 .github/scripts/import_hgv.py /tmp/hgv-manifest.txt

      - name: Show import summary
        shell: bash
        run: |
          head -n 12 IMPORT_REPORT.md
          echo "Website files:"
          find . -type f ! -path "./.git/*" ! -path "./.github/*" | wc -l
          echo "Website size:"
          du -sh . --exclude=.git --exclude=.github

      - name: Commit imported website
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "hgv-reference-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No website changes to commit."
            exit 0
          fi

          git commit -m "Import sanitized HGV reference website"
          git push
